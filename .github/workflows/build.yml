name: Build PortalMc
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JS syntax
        run: node --check behavior_pack/scripts/main.js
      - name: Script API mock tests
        run: node tests/test_core.cjs
      - name: Package .mcaddon
        run: python scripts/package_addon.py
      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortalMc-1.20.80
          path: dist/*.mcaddon
          if-no-files-found: error
      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mcaddon
          generate_release_notes: true
